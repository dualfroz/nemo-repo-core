[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nemo-repo-core"
version = "0.1.0"
description = "Shared foundation for repository-aware Nemo file manager plugins"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Michał Fox" }]
keywords = ["nemo", "cinnamon", "git", "file-manager", "nemo-python"]
classifiers = [
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment :: File Managers",
]

[tool.setuptools]
packages = ["nemoRepoCore"]
